name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        caffeinate aims to behave like the macOS command. If your idea goes beyond it,
        describe the use case so we can find the best way to support it.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should caffeinate behave? Example commands are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
