<svg xmlns="http://www.w3.org/2000/svg" width="680" height="326" viewBox="0 0 680 326" role="img" aria-label="Examples: caffeinate keeps the PC awake until Ctrl+C; caffeinate -d -t 3600 keeps the screen on for an hour; caffeinate robocopy keeps the PC awake while a copy runs; caffeinate -u -t 1 turns the screen on">
  <defs>
    <clipPath id="window"><rect width="680" height="326" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#window)">
    <rect width="680" height="326" fill="#0d1117"/>
    <rect width="680" height="44" fill="#161b22"/>
    <!-- Tab -->
    <path d="M16 44V18a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8v26z" fill="#0d1117"/>
    <rect x="30" y="20" width="16" height="16" rx="3" fill="#30363d"/>
    <path d="M34 25l3.5 3-3.5 3M39 31h3.5" fill="none" stroke="#e6edf3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="33" fill="#e6edf3" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">PowerShell</text>
    <path d="M186 24l8 8M194 24l-8 8" stroke="#8b949e" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M226 28h12M232 22v12" stroke="#8b949e" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Window buttons -->
    <g stroke="#8b949e" stroke-width="1.2" fill="none">
      <path d="M548 22h12"/>
      <rect x="598" y="16" width="11" height="11" rx="1"/>
      <path d="M646 16l11 11M657 16l-11 11"/>
    </g>
    <rect x="0" y="43.5" width="680" height="1" fill="#30363d"/>
    <!-- Examples, each with what it does -->
    <g font-family="'Cascadia Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="14.5" fill="#e6edf3">
      <text x="28" y="82" fill="#8b949e"># Keep your PC awake until you press Ctrl+C</text>
      <text x="28" y="106"><tspan fill="#7d8590">PS&gt;</tspan> <tspan fill="#f0b072" font-weight="600">caffeinate</tspan></text>
      <text x="28" y="146" fill="#8b949e"># Keep the screen on for an hour</text>
      <text x="28" y="170"><tspan fill="#7d8590">PS&gt;</tspan> <tspan fill="#f0b072" font-weight="600">caffeinate</tspan> <tspan fill="#79c0ff">-d -t</tspan> 3600</text>
      <text x="28" y="210" fill="#8b949e"># Stay awake while a big copy runs, then sleep as usual</text>
      <text x="28" y="234"><tspan fill="#7d8590">PS&gt;</tspan> <tspan fill="#f0b072" font-weight="600">caffeinate</tspan> robocopy D:\Photos E:\Backup <tspan fill="#79c0ff">/E</tspan></text>
      <text x="28" y="274" fill="#8b949e"># Turn the screen on, as a key press would</text>
      <text x="28" y="298"><tspan fill="#7d8590">PS&gt;</tspan> <tspan fill="#f0b072" font-weight="600">caffeinate</tspan> <tspan fill="#79c0ff">-u -t</tspan> 1</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="679" height="325" rx="11.5" fill="none" stroke="#30363d"/>
</svg>
